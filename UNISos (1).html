<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNISos</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--page:#dfe3ec;--ink:#14161c}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0b0d12;--ink:#e8eaf0}}
:root[data-theme="dark"]{--page:#0b0d12;--ink:#e8eaf0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:var(--page);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden}
#phone{--fg:#f3f4f8;--card:rgba(255,255,255,.1);--sheet:#14161d;--acc:#6ea8ff;--sfg:#fff;position:relative;width:min(372px,100%);height:min(790px,100%);border-radius:34px;overflow:hidden;background:#000;box-shadow:0 0 0 8px #0a0a0c,0 20px 60px rgba(0,0,0,.45);user-select:none;touch-action:none}
#phone.light{--fg:#14161c;--card:rgba(0,0,0,.06);--sheet:#f2f4f9}
@media (max-width:420px){#phone{border-radius:0;box-shadow:none}}
.layer{position:absolute;inset:0}
#wall{background:var(--wp);background-size:cover}
#status{position:absolute;top:0;left:0;right:0;height:34px;padding:8px 20px 0;display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--sfg);z-index:7}
#status button{all:unset;cursor:pointer}
#phone[data-app="1"]{--sfg:var(--fg)}
#lock{z-index:5;color:#fff;text-align:center;padding-top:110px;transition:transform .35s ease;background:linear-gradient(transparent 60%,rgba(0,0,0,.35));cursor:grab}
#lock .t{font-size:84px;font-weight:300;letter-spacing:-2px;line-height:1}
#lock .d{margin-top:8px;font-size:17px;opacity:.9}
#lock .n{margin:40px 24px 0;padding:14px;border-radius:18px;background:var(--card);backdrop-filter:blur(12px);text-align:left;font-size:14px}
#lock .h{position:absolute;bottom:42px;left:0;right:0;font-size:14px;opacity:.85;animation:bob 2s infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){#lock .h{animation:none}}
#pages{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x;z-index:1}
#pages::-webkit-scrollbar{display:none}
.pg{min-width:100%;scroll-snap-align:start;padding:56px 18px 150px;color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px}
.ic{all:unset;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;cursor:pointer;color:#fff;text-align:center}
.ic i{font-style:normal;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:30px;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.ic:active i{transform:scale(.92)}
.card{background:var(--card);backdrop-filter:blur(14px);border-radius:22px;padding:18px;margin-bottom:14px}
.card b{font-size:40px;font-weight:300}
#dock{position:absolute;left:14px;right:14px;bottom:58px;height:78px;border-radius:26px;background:var(--card);backdrop-filter:blur(16px);display:flex;justify-content:space-around;align-items:center;z-index:2}
#app{z-index:4;background:var(--sheet);color:var(--fg);display:flex;flex-direction:column;padding:34px 0 46px;transform:scale(.92);opacity:0;pointer-events:none;transition:.22s}
#app.on{transform:none;opacity:1;pointer-events:auto}
.hd{padding:10px 20px 8px;font-size:26px;font-weight:700}
.body{flex:1;overflow:auto;padding:6px 18px 40px;touch-action:pan-y}
#bar{position:absolute;bottom:0;left:0;right:0;height:46px;z-index:8;display:flex;justify-content:space-around;align-items:center;background:rgba(0,0,0,.4);backdrop-filter:blur(10px)}
#bar button{all:unset;cursor:pointer;color:#fff;font-size:22px;width:70px;text-align:center;line-height:46px}
#ctl{position:absolute;inset:0 0 46px 0;z-index:6;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:.2s}
#ctl.on{opacity:1;pointer-events:auto}
.sheet{width:100%;background:var(--sheet);color:var(--fg);border-radius:26px 26px 0 0;padding:20px 18px 24px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tiles button{all:unset;cursor:pointer;background:var(--card);border-radius:18px;padding:14px 4px;text-align:center;font-size:24px}
.tiles small{display:block;font-size:11px;margin-top:4px}
.sheet .ic{color:var(--fg)}
.ct{margin:18px 0 10px;font-weight:700}
#bar button:active{transform:scale(.8)}
#ctl .sheet{transform:translateY(40px);transition:transform .25s}#ctl.on .sheet{transform:none}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.pg .ic{animation:pop .4s backwards}
#rec{position:absolute;inset:0 0 46px 0;z-index:6;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);display:flex;flex-direction:column;justify-content:center;color:#fff;opacity:0;pointer-events:none;transition:.2s}
#rec.on{opacity:1;pointer-events:auto}
.cards{display:flex;gap:14px;overflow-x:auto;padding:20px 60px;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x}
.rc{flex:0 0 190px;height:310px;border-radius:22px;background:var(--sheet);color:var(--fg);scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:56px;position:relative;cursor:pointer;animation:pop .35s backwards}
.rc small{font-size:15px}.rc .x{position:absolute;top:10px;right:14px;font-size:18px}
[data-t]{cursor:pointer}
#lapps{position:absolute;bottom:84px;left:0;right:0;display:flex;justify-content:center;gap:18px}
#lapps .ic{font-size:10px}
#lapps .ic i{width:50px;height:50px;font-size:26px}
@media (prefers-reduced-motion:reduce){.pg .ic,.rc{animation:none}}
button.b{border:0;border-radius:14px;padding:10px 16px;font:inherit;font-weight:700;background:var(--acc);color:#07101f;cursor:pointer}
button.b.g{background:var(--card);color:var(--fg)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--card)}
.row i{font-style:normal;width:48px;height:48px;border-radius:13px;display:grid;place-items:center;font-size:26px}
.row div{flex:1}.row small{opacity:.65}
.disp{font-size:52px;text-align:right;padding:30px 4px 14px;min-height:110px;word-break:break-all;font-weight:300}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.keys button{border:0;border-radius:50%;aspect-ratio:1;font:inherit;font-size:22px;background:var(--card);color:var(--fg);cursor:pointer}
.keys button.o{background:#ff9500;color:#fff}
.vid{margin-bottom:18px;cursor:pointer}
.th{aspect-ratio:16/9;border-radius:14px;display:grid;place-items:center;font-size:44px}
textarea{width:100%;height:100%;min-height:380px;border:0;border-radius:16px;padding:14px;font:inherit;font-size:16px;background:var(--card);color:var(--fg);resize:none}
.sw{display:flex;gap:10px;margin-top:10px}.sw span{width:52px;height:52px;border-radius:14px;cursor:pointer}
.bar{height:5px;background:var(--card);border-radius:3px;margin:12px 0}.bar u{display:block;height:100%;background:#ff0033;border-radius:3px;width:0}
</style></head>
<body>
<div id="phone" data-app="0">
  <div id="wall" class="layer"></div>
  <div id="status"><span id="sc">9:41</span><span><button id="pw" aria-label="Lock">🔒</button> 5G 🔋</span></div>
  <div id="pages"></div>
  <div id="dock"></div>
  <div id="app" class="layer"></div>
  <div id="lock" class="layer">
    <div class="t" id="lt"></div><div class="d" id="ld"></div>
    <div class="n"><b>UNISos</b><br>Welcome. Swipe up to unlock.</div>
    <div id="lapps"></div><div class="h">⌃ swipe up to unlock</div>
  </div>
  <div id="rec"></div>
  <div id="ctl"></div>
  <div id="bar"><button id="nb" aria-label="Back">◁</button><button id="nh" aria-label="Home">○</button><button id="nm" aria-label="Recent apps" style="letter-spacing:-2px;font-weight:700">|||</button><button id="nr" aria-label="Control menu">□</button></div>
</div>
<script>
const $=s=>document.querySelector(s),P=$('#phone');
let S={inst:[],light:0,wp:0,note:''},T=null,R=[],cur=null;
try{Object.assign(S,JSON.parse(localStorage.getItem('unis')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('unis',JSON.stringify(S))}catch(e){}};
const WP=['linear-gradient(160deg,#2b1055,#7597de)','linear-gradient(160deg,#0f2027,#2c5364)','linear-gradient(160deg,#ff512f,#dd2476)','linear-gradient(160deg,#134e5e,#71b280)','linear-gradient(160deg,#f7971e,#ffd200)','linear-gradient(160deg,#232526,#414345)'];
const ACC=['#6ea8ff','#ff6b8a','#5ee0a0','#ffc44d','#b388ff','#ff8a50'];
const A={
store:{n:'App Store',e:'🛍️',c:'#2f80ed',core:1,run:store},
settings:{n:'Settings',e:'⚙️',c:'#8e8e93',core:1,run:settings},
calc:{n:'Calculator',e:'🧮',c:'#ff9500',run:calc,d:'Quick maths'},
yt:{n:'YouTube',e:'▶️',c:'#ff0033',run:yt,d:'Watch videos (demo)'},
notes:{n:'Notes',e:'📝',c:'#f5c542',run:notes,d:'Saved on this device'},
watch:{n:'Stopwatch',e:'⏱️',c:'#34c759',run:watch,d:'Time and laps'},
music:{n:'Music',e:'🎵',c:'#fa2d48',run:music,d:'Built-in tunes'},
games:{n:'Games',e:'🎮',c:'#5e5ce6',run:games,d:'Tic-tac-toe and Tap Rush'},
paint:{n:'Paint',e:'🎨',c:'#00a38c',run:paint,d:'Draw with your finger'},
weather:{n:'Weather',e:'⛅',c:'#32ade6',run:weather,d:'Demo forecast'},
camera:{n:'Camera',e:'📷',c:'#555a66',core:1,run:camera},
photos:{n:'Photos',e:'🖼️',c:'#ff7eb3',core:1,run:photos},
voice:{n:'Recorder',e:'🎙️',c:'#ef4444',core:1,run:voice}
};
function icon(id,d){const a=A[id];return `<button class="ic" data-id="${id}" style="animation-delay:${d||0}ms"><i style="background:${a.c}">${a.e}</i>${a.n}</button>`}
function home(){
  P.classList.toggle('light',!!S.light);$('#wall').style.setProperty('--wp',S.wpi?`url(${S.wpi}) center/cover`:WP[S.wp]);P.style.setProperty('--acc',ACC[S.ac||0]);
  const ids=['voice',...Object.keys(A).filter(i=>!A[i].core&&S.inst.includes(i))];
  $('#pages').innerHTML=`<div class="pg"><div class="card"><small>Welcome to UNISos</small><br>Tap the □ button to open your apps.</div></div>
  <div class="pg"><div class="card"><small>Today</small><br><b id="wt"></b></div><div class="card">Swipe left and right to switch pages. Get more apps from the App Store.</div></div>`;
  $('#dock').style.display='none';
  $('#lapps').innerHTML='';
  tick();
}
document.addEventListener('click',e=>{const b=e.target.closest('.ic');if(b)open(b.dataset.id)});
function open(id){
  const a=A[id],ap=$('#app');$('#ctl').classList.remove('on');R=R.filter(k=>k!=id);R.unshift(id);cur=id;$('#rec').classList.remove('on');
  ap.innerHTML=`<div class="hd">${a.n}</div><div class="body"></div>`;
  a.run(ap.querySelector('.body'));ap.classList.add('on');P.dataset.app=1;
}
function close(){cur=null;clearInterval(T);stopCam();$('#app').classList.remove('on');P.dataset.app=0}
function tick(){
  const d=new Date(),t=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  $('#sc').textContent=t;$('#lt').textContent=t;
  $('#ld').textContent=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});
  const w=$('#wt');if(w)w.textContent=t;
}
setInterval(tick,1000);
/* lock screen + gestures */
const L=$('#lock');let y0=null;
function unlock(){L.style.transform='translateY(-105%)'}
function lock(){close();$('#ctl').classList.remove('on');$('#rec').classList.remove('on');L.style.transform=''}
L.onpointerdown=e=>{y0=e.clientY;L.style.transition='none';L.setPointerCapture(e.pointerId)};
L.onpointermove=e=>{if(y0!=null)L.style.transform=`translateY(${Math.min(0,e.clientY-y0)}px)`};
L.onpointerup=e=>{if(y0==null)return;const dy=e.clientY-y0;y0=null;L.style.transition='';const ic=document.elementFromPoint(e.clientX,e.clientY)?.closest('.ic');if(Math.abs(dy)<6&&ic){unlock();open(ic.dataset.id);return}if(dy<-90||Math.abs(dy)<6)unlock();else L.style.transform=''};
$('#pw').onclick=lock;
const C=$('#ctl');
function ctl(){
  const ids=Object.keys(A).filter(i=>A[i].core||S.inst.includes(i));
  C.innerHTML=`<div class="sheet"><div class="tiles"><button data-a="lm">${S.light?'☀️':'🌙'}<small>Light mode</small></button><button data-a="wp">🖼️<small>Wallpaper</small></button><button data-a="cl">✖️<small>Close app</small></button><button data-a="lk">🔒<small>Lock</small></button></div><p class="ct">Apps</p><div class="grid">${ids.map(icon).join('')}</div></div>`;
}
const RC=$('#rec');
function rec(){
  RC.innerHTML=R.length?`<div class="cards">${R.map(i=>`<div class="rc" data-o="${i}"><span class="x" data-x="${i}">✕</span>${A[i].e}<small>${A[i].n}</small></div>`).join('')}</div><p style="text-align:center"><button class="b g" data-x="all">Clear all</button></p>`:'<p style="text-align:center">No running apps</p>';
}
RC.onclick=e=>{
  const x=e.target.closest('[data-x]');
  if(x){const k=x.dataset.x;if(k=='all'||k=='music')stopMusic();R=k=='all'?[]:R.filter(i=>i!=k);if(cur&&!R.includes(cur))close();rec();return}
  const c=e.target.closest('[data-o]');
  if(c){open(c.dataset.o);return}
  RC.classList.remove('on');
};
$('#nm').onclick=()=>{C.classList.remove('on');if(RC.classList.toggle('on'))rec()};
$('#nh').onclick=()=>{C.classList.remove('on');RC.classList.remove('on');close()};
$('#nb').onclick=()=>{if(C.classList.contains('on'))C.classList.remove('on');else close()};
$('#nr').onclick=()=>{RC.classList.remove('on');if(C.classList.toggle('on'))ctl()};
C.onclick=e=>{
  if(e.target===C){C.classList.remove('on');return}
  const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
  if(a=='lm'){S.light=S.light?0:1;save();home();ctl()}
  else if(a=='wp'){S.wp=(S.wp+1)%WP.length;S.wpi='';save();home()}
  else if(a=='cl'){close();C.classList.remove('on')}
  else if(a=='lk')lock();
};
/* App Store */
function store(b){
  const draw=()=>{b.innerHTML=Object.keys(A).filter(i=>!A[i].core).map(i=>{const a=A[i],on=S.inst.includes(i);
    return `<div class="row"><i style="background:${a.c}">${a.e}</i><div><b>${a.n}</b><br><small>${a.d}</small></div><button class="b ${on?'g':''}" data-i="${i}">${on?'Remove':'Get'}</button></div>`}).join('');
    b.querySelectorAll('button').forEach(x=>x.onclick=()=>{const i=x.dataset.i;S.inst=S.inst.includes(i)?S.inst.filter(k=>k!==i):[...S.inst,i];save();home();draw()})};
  draw();
}
/* Settings */
function settings(b){
  b.innerHTML=`<div class="row"><div><b>Light mode</b></div><button class="b g" id="lm">${S.light?'On':'Off'}</button></div>
  <p><b>Wallpaper</b></p><div class="sw" style="flex-wrap:wrap">${WP.map((w,i)=>`<span data-w="${i}" style="background:${w}"></span>`).join('')}</div>
  <p><button class="b g" id="up">Upload wallpaper</button><input id="uf" type="file" accept="image/*" hidden></p><p><b>Accent color</b></p><div class="sw" style="flex-wrap:wrap">${ACC.map((c,i)=>`<span data-c="${i}" style="background:${c}"></span>`).join('')}</div><p style="margin-top:28px"><button class="b g" id="rs">Remove all apps</button></p><p><small>UNISos 0.1 prototype</small></p>`;
  b.querySelector('#lm').onclick=e=>{S.light=S.light?0:1;save();home();e.target.textContent=S.light?'On':'Off'};
  b.querySelectorAll('[data-w]').forEach(s=>s.onclick=()=>{S.wp=+s.dataset.w;S.wpi='';save();home()});
  b.querySelector('#rs').onclick=()=>{S.inst=[];save();home()};
  b.querySelectorAll('[data-c]').forEach(s=>s.onclick=()=>{S.ac=+s.dataset.c;save();home()});
  b.querySelector('#up').onclick=()=>b.querySelector('#uf').click();
  b.querySelector('#uf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>setWall(r.result);r.readAsDataURL(f)};
}
/* Calculator */
function calc(b){
  let x='';b.innerHTML='<div class="disp">0</div><div class="keys"></div>';
  const d=b.querySelector('.disp'),k=b.querySelector('.keys');
  'C ( ) ÷ 7 8 9 × 4 5 6 − 1 2 3 + 0 . ⌫ ='.split(' ').forEach(c=>{
    const e=document.createElement('button');e.textContent=c;if('÷×−+='.includes(c))e.className='o';
    e.onclick=()=>{
      if(c=='C')x='';else if(c=='⌫')x=x.slice(0,-1);
      else if(c=='='){const s=x.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-');
        try{if(!/^[\d+\-*/.() ]+$/.test(s))throw 0;const r=Function('return '+s)();x=isFinite(r)?String(parseFloat(r.toFixed(10))):'Error'}catch(_){x='Error'}}
      else{if(x=='Error')x='';x+=c}
      d.textContent=x||'0'};k.append(e)});
}
/* YouTube (demo, no real streaming) */
function ytOld(b){
  const V=[['Sunrise timelapse','Nature Lab','#f7971e'],['Learn chess in 10 minutes','Board Club','#4facfe'],['Lo-fi beats to build to','Chill Room','#a18cd1'],['Street food tour','Wanderbites','#f857a6']];
  b.innerHTML=V.map((v,i)=>`<div class="vid" data-i="${i}"><div class="th" style="background:${v[2]}">▶️</div><p style="margin:8px 0 0"><b>${v[0]}</b><br><small>${v[1]}</small></p></div>`).join('');
  b.querySelectorAll('.vid').forEach(el=>el.onclick=()=>{const v=V[el.dataset.i];let p=0,run=1;
    b.innerHTML=`<div class="th" style="background:${v[2]}" id="pl">⏸️</div><div class="bar"><u id="pb"></u></div><b>${v[0]}</b><br><small>${v[1]} · demo player, no real video</small><p><button class="b g" id="bk">Back</button></p>`;
    clearInterval(T);T=setInterval(()=>{if(run){p=(p+1)%100;b.querySelector('#pb').style.width=p+'%'}},300);
    b.querySelector('#pl').onclick=e=>{run=!run;e.target.textContent=run?'⏸️':'▶️'};
    b.querySelector('#bk').onclick=()=>{clearInterval(T);yt(b)}});
}
/* Notes */
function notes(b){
  b.innerHTML='<textarea placeholder="Write something…"></textarea>';
  const t=b.querySelector('textarea');t.value=S.note;t.oninput=()=>{S.note=t.value;save()};
}
/* Stopwatch */
function watch(b){
  let ms=0,on=0,laps=[];
  b.innerHTML='<div class="disp" style="text-align:center">0:00.0</div><div class="sw" style="justify-content:center"><button class="b" id="go">Start</button><button class="b g" id="lp">Lap</button><button class="b g" id="rz">Reset</button></div><div id="ll"></div>';
  const d=b.querySelector('.disp'),f=m=>`${Math.floor(m/60000)}:${String(Math.floor(m/1000)%60).padStart(2,'0')}.${Math.floor(m/100)%10}`;
  T=setInterval(()=>{if(on){ms+=100;d.textContent=f(ms)}},100);
  b.querySelector('#go').onclick=e=>{on=!on;e.target.textContent=on?'Pause':'Start'};
  b.querySelector('#lp').onclick=()=>{laps.unshift(f(ms));b.querySelector('#ll').innerHTML=laps.map((l,i)=>`<div class="row">Lap ${laps.length-i}<span style="margin-left:auto">${l}</span></div>`).join('')};
  b.querySelector('#rz').onclick=()=>{ms=0;laps=[];on=0;d.textContent='0:00.0';b.querySelector('#ll').innerHTML='';b.querySelector('#go').textContent='Start'};
}
/* YouTube embed */
function yt(b){ytNew(b)}
function ytOld2(b){
  const V=[['Never Gonna Give You Up','Rick Astley','dQw4w9WgXcQ'],['Me at the zoo','jawed','jNQXAC9IVRw'],['Big Buck Bunny','Blender','aqz-KE-bpKQ']],CO=['#f7971e','#4facfe','#a18cd1'];
  const play=(id,t)=>{b.innerHTML=`<div style="aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;display:grid;place-items:center;color:#fff;position:relative"><small>Loading player…</small><iframe style="position:absolute;inset:0;width:100%;height:100%;border:0" src="https://www.youtube-nocookie.com/embed/${id}?playsinline=1" allow="autoplay;encrypted-media;fullscreen" allowfullscreen></iframe></div><p><b>${t}</b></p><button class="b g" id="yb">Back</button>`;b.querySelector('#yb').onclick=()=>yt(b)};
  b.innerHTML=`<div class="sw" style="margin:0 0 14px"><input id="yi" placeholder="Paste a YouTube link" style="flex:1;min-width:0;border:0;border-radius:14px;padding:12px;font:inherit;background:var(--card);color:var(--fg)"><button class="b" id="yg" style="background:#ff0033;color:#fff">Go</button></div>`+V.map((v,i)=>`<div class="vid" data-i="${i}"><div class="th" style="background:${CO[i]}">▶️</div><p style="margin:8px 0 0"><b>${v[0]}</b><br><small>${v[1]}</small></p></div>`).join('');
  b.querySelectorAll('.vid').forEach(el=>el.onclick=()=>{const v=V[el.dataset.i];play(v[2],v[0])});
  b.querySelector('#yg').onclick=()=>{const s=b.querySelector('#yi').value.trim(),m=s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/)||s.match(/^([\w-]{11})$/);if(m)play(m[1],'Your video')};
}
/* Music */
let MT=null,AC=null;
function stopMusic(){clearInterval(MT);MT=null}
function music(b){
  const TR=[['Sunrise Loop',[262,330,392,330,294,349,440,349]],['Night Drive',[220,262,330,262,196,247,294,247]],['Arcade Hop',[392,523,392,659,523,784,659,523]]];
  let k=0;
  b.innerHTML=`<div class="th" style="background:#fa2d48;font-size:70px">🎵</div><h3 id="mt" style="margin:14px 0 8px"></h3><button class="b" id="mp"></button><div id="ml" style="margin-top:10px"></div>`;
  const play=on=>{stopMusic();if(!on)return;AC=AC||new (window.AudioContext||window.webkitAudioContext)();let n=0;
    MT=setInterval(()=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=TR[k][1][n++%8];g.gain.setValueAtTime(.2,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.4);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.4)},420)};
  const draw=()=>{b.querySelector('#mt').textContent=TR[k][0];b.querySelector('#mp').textContent=MT?'Pause':'Play';
    b.querySelector('#ml').innerHTML=TR.map((t,i)=>`<div class="row" data-t="${i}">${i==k&&MT?'🔊':'🎶'} ${t[0]}</div>`).join('');
    b.querySelectorAll('[data-t]').forEach(r=>r.onclick=()=>{k=+r.dataset.t;play(1);draw()})};
  b.querySelector('#mp').onclick=()=>{play(!MT);draw()};draw();
}
/* Games */
function games(b){
  b.innerHTML='<div class="sw" style="margin:0 0 12px;flex-wrap:wrap"><button class="b" id="g1">Tic-tac-toe</button><button class="b" id="g2">Tap Rush</button><button class="b" id="g3">Memory</button><button class="b" id="g4">Snake</button></div><div id="gb"></div>';
  const G=b.querySelector('#gb');
  b.querySelector('#g1').onclick=()=>{clearInterval(T);let s=Array(9).fill(''),end=0;
    const W=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],win=p=>W.some(w=>w.every(i=>s[i]==p));
    const draw=m=>{G.innerHTML=`<p>${m}</p><div class="keys" style="grid-template-columns:repeat(3,1fr)">${s.map((v,i)=>`<button data-i="${i}" style="font-size:34px;border-radius:16px">${v}</button>`).join('')}</div>`;
      G.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{const i=+x.dataset.i;if(end||s[i])return;s[i]='X';
        if(win('X')){end=1;return draw('You win! 🎉')}
        const f=s.map((v,q)=>v?-1:q).filter(q=>q>=0);if(!f.length){end=1;return draw('Draw')}
        s[f[Math.floor(Math.random()*f.length)]]='O';
        if(win('O')){end=1;return draw('Computer wins')}draw('Your move')})};
    draw('Your move (X)')};
  b.querySelector('#g3').onclick=()=>{clearInterval(T);const E=['🍎','🚀','🐱','🎸','🌵','⚽'];let c=[...E,...E].sort(()=>Math.random()-.5),op=[],dn=[],mv=0,lk=0;
    const draw=()=>{G.innerHTML=`<p>Moves ${mv}${dn.length==12?' · You won! 🎉':''}</p><div class="keys" style="grid-template-columns:repeat(4,1fr)">${c.map((e,i)=>`<button data-i="${i}" style="border-radius:14px;font-size:28px">${op.includes(i)||dn.includes(i)?e:'❔'}</button>`).join('')}</div>`;
      G.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{const i=+x.dataset.i;if(lk||op.includes(i)||dn.includes(i))return;op.push(i);draw();
        if(op.length==2){mv++;lk=1;setTimeout(()=>{if(c[op[0]]==c[op[1]])dn.push(...op);op=[];lk=0;draw()},600)}})};draw()};
  b.querySelector('#g4').onclick=()=>{clearInterval(T);G.innerHTML='<p id="sk">Score 0</p><canvas id="sc" width="300" height="300" style="width:100%;border-radius:14px;background:var(--card)"></canvas><div class="keys" style="grid-template-columns:repeat(3,1fr);margin-top:10px"><span></span><button data-d="U">⬆️</button><span></span><button data-d="L">⬅️</button><button data-d="D">⬇️</button><button data-d="R">➡️</button></div>';
    const x=G.querySelector('#sc').getContext('2d'),V={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};let s=[[7,7]],d=V.R,f=[3,3],sc=0;
    G.querySelectorAll('[data-d]').forEach(k=>k.onclick=()=>{const n=V[k.dataset.d];if(n[0]+d[0]||n[1]+d[1])d=n});
    T=setInterval(()=>{const h=[s[0][0]+d[0],s[0][1]+d[1]];
      if(h[0]<0||h[1]<0||h[0]>14||h[1]>14||s.some(p=>p[0]==h[0]&&p[1]==h[1])){clearInterval(T);G.querySelector('#sk').textContent='Game over · Score '+sc;return}
      s.unshift(h);if(h[0]==f[0]&&h[1]==f[1]){sc++;f=[Math.floor(Math.random()*15),Math.floor(Math.random()*15)];G.querySelector('#sk').textContent='Score '+sc}else s.pop();
      x.clearRect(0,0,300,300);x.fillStyle='#34c759';s.forEach(p=>x.fillRect(p[0]*20+1,p[1]*20+1,18,18));x.fillStyle='#ff3b30';x.fillRect(f[0]*20+1,f[1]*20+1,18,18)},170)};
  b.querySelector('#g2').onclick=()=>{clearInterval(T);let sc=0,t=15;
    const draw=()=>{G.innerHTML=`<p>Score ${sc} · Time ${t}s</p><div style="position:relative;height:340px;border-radius:16px;background:var(--card)"><span id="tg" style="position:absolute;font-size:40px;cursor:pointer;left:${Math.random()*80}%;top:${Math.random()*80}%">🎯</span></div>`;
      G.querySelector('#tg').onclick=()=>{if(t>0){sc++;draw()}}};
    draw();T=setInterval(()=>{if(--t<=0){clearInterval(T);G.innerHTML=`<p>Time up! Score ${sc}</p>`}else{const p=G.querySelector('p');if(p)p.textContent=`Score ${sc} · Time ${t}s`}},1000)};
}
/* Paint */
function paint(b){
  b.innerHTML='<canvas id="cv" width="340" height="420" style="width:100%;border-radius:16px;background:#fff;touch-action:none"></canvas><div class="sw" id="pc"></div><button class="b g" id="pcl" style="margin-top:10px">Clear</button>';
  const cv=b.querySelector('#cv'),x=cv.getContext('2d');let col='#e53935',d=0;x.lineWidth=5;x.lineCap='round';
  ['#e53935','#1e88e5','#43a047','#111111'].forEach(c=>{const s=document.createElement('span');s.style.background=c;s.onclick=()=>col=c;b.querySelector('#pc').append(s)});
  const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.onpointerdown=e=>{d=1;cv.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...pt(e))};
  cv.onpointermove=e=>{if(!d)return;x.strokeStyle=col;x.lineTo(...pt(e));x.stroke()};
  cv.onpointerup=()=>d=0;
  b.querySelector('#pcl').onclick=()=>x.clearRect(0,0,340,420);
}
/* Weather (demo data) */
function weather(b){
  const D=[['Today','☀️',24],['Tue','⛅',22],['Wed','🌧️',19],['Thu','⛈️',18],['Fri','☀️',25]];
  b.innerHTML='<div class="th" style="background:linear-gradient(#32ade6,#5e9cff);font-size:64px">☀️ 24°</div><p><small>Demo forecast, not live data</small></p>'+D.map(d=>`<div class="row"><div>${d[0]}</div><span>${d[1]} ${d[2]}°</span></div>`).join('');
}
/* Wallpaper from image */
function setWall(u){const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.wpi=c.toDataURL('image/jpeg',.8);save();home()};im.src=u}
/* Camera, Photos, Recorder */
let PH=[],ST=null,REC=null,CH=[],VR=[];
function stopCam(){if(ST){ST.getTracks().forEach(t=>t.stop());ST=null}}
function camera(b){
  b.innerHTML='<video id="cv" autoplay playsinline muted style="width:100%;border-radius:16px;background:#000;aspect-ratio:3/4;object-fit:cover"></video><p id="cm" style="text-align:center"></p><div class="sw" style="justify-content:center"><button class="b" id="sh">Take photo</button><button class="b g" id="fl">Flip</button></div>';
  let face='environment';const v=b.querySelector('#cv'),m=b.querySelector('#cm');
  const go=async()=>{stopCam();try{ST=await navigator.mediaDevices.getUserMedia({video:{facingMode:face}});v.srcObject=ST}catch(e){m.textContent='Camera is not available here. Allow camera access, or use the Android app.'}};
  b.querySelector('#sh').onclick=()=>{if(!ST||!v.videoWidth)return;const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);PH.unshift(c.toDataURL('image/jpeg',.85));m.textContent='Saved to Photos'};
  b.querySelector('#fl').onclick=()=>{face=face=='user'?'environment':'user';go()};go();
}
function photos(b){
  b.innerHTML='<button class="b" id="pa">Add from device</button><input id="pf" type="file" accept="image/*" multiple hidden><div id="pgr" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px"></div>';
  const g=b.querySelector('#pgr'),draw=()=>{g.innerHTML=PH.length?PH.map((u,i)=>`<img data-i="${i}" src="${u}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer">`).join(''):'<p style="grid-column:1/4"><small>No photos yet. Take one with Camera or add from your device.</small></p>';
    g.querySelectorAll('img').forEach(im=>im.onclick=()=>{b.innerHTML=`<img src="${PH[im.dataset.i]}" style="width:100%;border-radius:14px"><p><button class="b g" id="pb">Back</button> <button class="b" id="pw2">Use as wallpaper</button></p>`;b.querySelector('#pb').onclick=()=>photos(b);b.querySelector('#pw2').onclick=()=>setWall(PH[im.dataset.i])})};
  b.querySelector('#pa').onclick=()=>b.querySelector('#pf').click();
  b.querySelector('#pf').onchange=e=>{[...e.target.files].forEach(f=>{const r=new FileReader();r.onload=()=>{PH.unshift(r.result);draw()};r.readAsDataURL(f)})};
  draw();
}
function voice(b){
  b.innerHTML='<div class="th" style="background:#ef4444;font-size:60px">🎙️</div><p style="text-align:center" id="vs">Ready</p><div class="sw" style="justify-content:center"><button class="b" id="vb">Record</button></div><div id="vl"></div>';
  const s=b.querySelector('#vs'),btn=b.querySelector('#vb'),list=()=>{b.querySelector('#vl').innerHTML=VR.map((u,i)=>`<div class="row">🎧 Recording ${VR.length-i}<audio controls src="${u}" style="max-width:150px;margin-left:auto"></audio></div>`).join('')};
  list();
  btn.onclick=async()=>{
    if(REC){REC.stop();return}
    try{const st=await navigator.mediaDevices.getUserMedia({audio:true});CH=[];REC=new MediaRecorder(st);
      REC.ondataavailable=e=>CH.push(e.data);
      REC.onstop=()=>{st.getTracks().forEach(t=>t.stop());const fr=new FileReader();fr.onload=()=>{VR.unshift(fr.result);if(b.isConnected){btn.textContent='Record';s.textContent='Saved';list()}};fr.readAsDataURL(new Blob(CH,{type:REC.mimeType}));REC=null};
      REC.start();btn.textContent='Stop';s.textContent='Recording…'}catch(e){s.textContent='Microphone is not available here. Allow microphone access.'}};
}
function ytNew(b){
  const V=[['Never Gonna Give You Up','Rick Astley','dQw4w9WgXcQ'],['Me at the zoo','jawed','jNQXAC9IVRw'],['Big Buck Bunny','Blender','aqz-KE-bpKQ']],CO=['#f7971e','#4facfe','#a18cd1'];
  const go=u=>{const w=window.open(u,'_blank','noopener');if(!w)b.querySelector('#yn').innerHTML=`<a href="${u}" target="_blank" rel="noopener" style="color:var(--acc)">Tap here to open YouTube</a>`};
  b.innerHTML=`<div class="sw" style="margin:0 0 6px"><input id="yi" placeholder="Search or paste a YouTube link" style="flex:1;min-width:0;border:0;border-radius:14px;padding:12px;font:inherit;background:var(--card);color:var(--fg)"><button class="b" id="yg" style="background:#ff0033;color:#fff">Go</button></div><p id="yn" style="margin:0 0 14px"><small>Videos open in your browser or the YouTube app.</small></p>`+V.map((v,i)=>`<div class="vid" data-i="${i}"><div class="th" style="background:${CO[i]}">▶️</div><p style="margin:8px 0 0"><b>${v[0]}</b><br><small>${v[1]}</small></p></div>`).join('');
  b.querySelectorAll('.vid').forEach(el=>el.onclick=()=>go('https://www.youtube.com/watch?v='+V[el.dataset.i][2]));
  b.querySelector('#yg').onclick=()=>{const s=b.querySelector('#yi').value.trim(),m=s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/)||s.match(/^([\w-]{11})$/);go(m?'https://www.youtube.com/watch?v='+m[1]:s?'https://www.youtube.com/results?search_query='+encodeURIComponent(s):'https://www.youtube.com/')};
}
home();
</script>
